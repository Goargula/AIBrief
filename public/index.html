<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#070a0f">
    <title>AI Brief</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="/styles.css?v=35">
  </head>
  <body>
    <main class="reader-shell">
      <header class="reader-top">
        <div>
          <p><img src="/logo.svg" alt="" class="top-logo"> AI Brief</p>
          <strong id="storyPosition">Loading</strong>
        </div>
        <nav class="sort-bar" aria-label="Story sort">
          <button class="sort active" type="button" data-sort="relevance">Relevant</button>
          <button class="sort" type="button" data-sort="recency">Recent</button>
        </nav>
        <div class="top-actions">
          <button id="filterButton" class="icon-action" type="button" aria-label="Filter stories" title="Filter stories" aria-expanded="false" aria-controls="filterMenu">
            <span aria-hidden="true">&#9776;</span>
          </button>
          <button id="refreshButton" class="icon-action" type="button" aria-label="Refresh stories" title="Refresh stories">
            <span aria-hidden="true">&#8635;</span>
          </button>
          <button id="profileButton" class="icon-action" type="button" aria-label="Open profile" title="Profile">
            <span aria-hidden="true">&#9678;</span>
          </button>
        </div>
      </header>

      <section id="filterMenu" class="filter-menu" aria-label="Story filters" hidden>
        <button class="filter active" type="button" data-filter="all">All</button>
        <button class="filter" type="button" data-filter="funding">Funding & deals</button>
        <button class="filter" type="button" data-filter="models">Model releases</button>
        <button class="filter" type="button" data-filter="papers">Papers</button>
        <button class="filter" type="button" data-filter="pushback">AI pushbacks</button>
        <button class="filter" type="button" data-filter="general">General</button>
      </section>

      <section id="storyDeck" class="story-deck" aria-label="AI story reader"></section>
    </main>

    <template id="storyTemplate">
      <article class="story-card">
        <img class="story-image" alt="">
        <div class="story-shade"></div>
        <div class="story-content">
          <div class="story-meta">
            <span class="lane"></span>
            <span class="source"></span>
            <span class="time"></span>
          </div>
          <h1></h1>
          <p class="hook"></p>
          <details>
            <summary>Read more</summary>
            <p class="change"></p>
            <p class="facts"></p>
            <p class="coverage"></p>
            <p class="watch"></p>
          </details>
          <div class="story-actions">
            <button class="save" type="button">Save</button>
            <button class="share" type="button">Share</button>
            <a class="original" target="_blank" rel="noopener noreferrer">Original</a>
          </div>
        </div>
      </article>
    </template>

    <dialog id="profileDialog" class="profile-dialog">
      <section class="profile-sheet">
        <header>
          <div>
            <p>Profile</p>
            <h2>Your reading trail</h2>
            <a class="profile-feedback" href="https://www.linkedin.com/in/arshdeep-singh-gulati-638468114/" target="_blank" rel="noopener noreferrer">Give Feedback</a>
          </div>
          <button id="closeProfile" type="button" aria-label="Close profile">Close</button>
        </header>
        <div class="profile-auth">
          <p id="authStatus">Saves are local on this device.</p>
          <div>
            <button id="signInButton" type="button">Sign in with Google</button>
            <button id="signOutButton" type="button" hidden>Sign out</button>
          </div>
        </div>
        <div class="profile-stats">
          <div>
            <span id="savedCount">0</span>
            <strong>Saved</strong>
          </div>
          <div>
            <span id="openedCount">0</span>
            <strong>Opened</strong>
          </div>
        </div>
        <div class="profile-panel">
          <h3>Saved stories</h3>
          <div id="savedList" class="profile-list"></div>
        </div>
        <p class="profile-note">Unsigned saves stay on this device. Sign in with Google to sync saved stories across devices.</p>
      </section>
    </dialog>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

    <script src="/app.js?v=35" type="module"></script>
  </body>
</html>
